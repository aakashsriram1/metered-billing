# These are local demo values only. Copy .env.example to .env for production.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: metered_billing
      POSTGRES_USER: metered_user
      POSTGRES_PASSWORD: metered_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: dev-secret-key
      DJANGO_DEBUG: "true"
      DB_NAME: metered_billing
      DB_USER: metered_user
      DB_PASSWORD: metered_password
      DB_HOST: db
      DB_PORT: "5432"
      PAYMENT_WEBHOOK_SECRET: dev-payment-secret
      API_KEY_HASH_SECRET: dev-api-key-hash-secret
      OPS_TOKEN: dev-ops-token
    depends_on:
      - db

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

  worker:
    build: ./backend
    command: python manage.py run_worker
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SECRET_KEY: dev-secret-key
      DJANGO_DEBUG: "true"
      DB_NAME: metered_billing
      DB_USER: metered_user
      DB_PASSWORD: metered_password
      DB_HOST: db
      DB_PORT: "5432"
      PAYMENT_WEBHOOK_SECRET: dev-payment-secret
      API_KEY_HASH_SECRET: dev-api-key-hash-secret
      OPS_TOKEN: dev-ops-token
    depends_on:
      - db
      - backend

volumes:
  postgres_data:
